name: Release & Package Distribution

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build Packages & Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Validate Manifest & Assets
        run: node scripts/validate-manifest.js

      - name: Execute Full Test Suite
        run: |
          node run-tests.js
          node tests/challenger-ad-skipper-adversarial.js
          node tests/challenger-adversarial-hud-and-modals.js
          node tests/challenger-m4_1-empirical-stress.js
          node tests/challenger-m3-empirical-stress.js

      - name: Build Distribution Packages
        run: npm run package

      - name: Create GitHub Release & Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/youtube-shield-chrome.zip
            dist/youtube-shield-firefox.zip
          draft: false
          prerelease: false
          generate_release_notes: true
