<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shield for YouTube</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="../assets/fonts/inter.css">
  <link rel="icon" type="image/png" href="../assets/icons/icon32.png">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="shield-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </span>
        <div class="logo-title">
          <strong>Shield</strong> <span class="logo-sub">for YouTube</span>
        </div>
      </div>
      
      <div class="header-actions">
        <!-- Master Pill Switch: On / Off -->
        <label class="pill-toggle" for="toggle-master" title="Master Switch">
          <input type="checkbox" id="toggle-master" role="switch" checked aria-label="Enable Extension" />
          <span class="pill-slider">
            <span class="pill-state-on">On</span>
            <span class="pill-state-off">Off</span>
            <span class="pill-thumb"></span>
          </span>
        </label>
        
        <!-- Settings Gear / Open Dashboard -->
        <button class="icon-btn" id="open-settings" title="Settings & Options" aria-label="Open Settings" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Circular Hero Session Timer -->
    <section class="hero-session" id="study-card">
      <div class="timer-ring-wrap">
        <svg class="timer-ring-svg" viewBox="0 0 140 140" width="140" height="140">
          <circle class="ring-bg" cx="70" cy="70" r="58" />
          <circle class="ring-fg" id="timer-ring-progress" cx="70" cy="70" r="58" />
        </svg>
        <div class="timer-inner">
          <div class="session-time" id="session-time" aria-live="polite">00:00:00</div>
          <div class="session-label">This session</div>
        </div>
      </div>

      <!-- Goal Pill Button -->
      <div class="goal-pill" id="edit-goal" role="button" tabindex="0" title="Click to edit learning goal">
        <span class="goal-pencil">✏️</span>
        <span class="goal-prefix">Goal —</span>
        <span class="goal-text" id="current-goal">Learn something new</span>
      </div>

      <!-- Inline Goal Edit Box -->
      <div class="goal-input-container" id="goal-input-container" style="display: none;">
        <input type="text" id="goal-input" placeholder="Enter learning goal..." aria-label="Learning Goal" />
        <div class="goal-btn-row">
          <button id="save-goal" type="button" class="btn-primary">Save</button>
          <button id="search-goal" type="button" class="btn-secondary">🔍 Search</button>
        </div>
      </div>
    </section>

    <!-- Section 1: Protections -->
    <div class="section-heading">Protections</div>
    <div class="card-group">
      <!-- 1. Shorts Blocker -->
      <label class="feature-row" for="toggle-shorts">
        <div class="icon-box icon-red">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
          </svg>
        </div>
        <div class="feature-info">
          <div class="feature-title">Shorts blocker</div>
          <div class="feature-desc">Redirects away from Shorts automatically</div>
        </div>
        <div class="toggle-switch">
          <input type="checkbox" id="toggle-shorts" role="switch" aria-checked="false" />
          <span class="slider"></span>
        </div>
      </label>

      <!-- 2. Focus Mode -->
      <label class="feature-row" for="toggle-focus">
        <div class="icon-box icon-emerald">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="6"/>
            <circle cx="12" cy="12" r="2"/>
          </svg>
        </div>
        <div class="feature-info">
          <div class="feature-title">Focus mode</div>
          <div class="feature-desc">Hides recommendations, comments and sidebar</div>
        </div>
        <div class="toggle-switch">
          <input type="checkbox" id="toggle-focus" role="switch" aria-checked="false" />
          <span class="slider"></span>
        </div>
      </label>

      <!-- 3. Ghost Shield -->
      <label class="feature-row" for="toggle-ghost-shield">
        <div class="icon-box icon-purple">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 19v1a3 3 0 0 0 6 0v-1"/>
            <path d="M12 2a8 8 0 0 0-8 8c0 3.5 2 6 2 8h12c0-2 2-4.5 2-8a8 8 0 0 0-8-8z"/>
          </svg>
        </div>
        <div class="feature-info">
          <div class="feature-title">Ghost shield</div>
          <div class="feature-desc">Purges blocked channels, strict playback block</div>
        </div>
        <div class="toggle-switch">
          <input type="checkbox" id="toggle-ghost-shield" role="switch" aria-checked="false" />
          <span class="slider"></span>
        </div>
      </label>
    </div>

    <!-- Section 2: Manage -->
    <div class="section-heading">Manage</div>
    <div class="card-group">
      <!-- Accordion 1: Time Manager -->
      <div class="accordion-item" id="acc-time-manager">
        <div class="accordion-header" role="button" tabindex="0" aria-expanded="false">
          <div class="icon-box icon-amber">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <div class="feature-info">
            <div class="feature-title">Time manager</div>
            <div class="feature-desc" id="acc-time-desc">2h daily limit • Quiet hours active</div>
          </div>
          <svg class="chevron-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        <div class="accordion-body">
          <label class="sub-toggle-row" for="toggle-time-manager">
            <span class="sub-toggle-label">Enable Daily Time Budget</span>
            <div class="toggle-switch">
              <input type="checkbox" id="toggle-time-manager" role="switch" aria-checked="false" />
              <span class="slider"></span>
            </div>
          </label>
        </div>
      </div>

      <!-- Accordion 2: Focus Features -->
      <div class="accordion-item" id="acc-focus-features">
        <div class="accordion-header" role="button" tabindex="0" aria-expanded="false">
          <div class="icon-box icon-teal">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="21" x2="4" y2="14"/>
              <line x1="4" y1="10" x2="4" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="12"/>
              <line x1="12" y1="8" x2="12" y2="3"/>
              <line x1="20" y1="21" x2="20" y2="16"/>
              <line x1="20" y1="12" x2="20" y2="3"/>
              <line x1="1" y1="14" x2="7" y2="14"/>
              <line x1="9" y1="8" x2="15" y2="8"/>
              <line x1="17" y1="16" x2="23" y2="16"/>
            </svg>
          </div>
          <div class="feature-info">
            <div class="feature-title">Focus features</div>
            <div class="feature-desc" id="acc-focus-desc">Study Mode, Goal Mode, Ad Skipper</div>
          </div>
          <svg class="chevron-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        <div class="accordion-body">
          <label class="sub-toggle-row" for="toggle-study">
            <span class="sub-toggle-label">🎓 Study Mode (Pomodoro Timer)</span>
            <div class="toggle-switch">
              <input type="checkbox" id="toggle-study" role="switch" aria-checked="false" />
              <span class="slider"></span>
            </div>
          </label>
          <label class="sub-toggle-row" for="toggle-goal">
            <span class="sub-toggle-label">🎯 Goal Mode (Strict Intentional)</span>
            <div class="toggle-switch">
              <input type="checkbox" id="toggle-goal" role="switch" aria-checked="false" />
              <span class="slider"></span>
            </div>
          </label>
          <label class="sub-toggle-row" for="toggle-auto-skip-ads">
            <span class="sub-toggle-label">⚡ Auto Skip Ads (16x Turbo)</span>
            <div class="toggle-switch">
              <input type="checkbox" id="toggle-auto-skip-ads" role="switch" aria-checked="false" />
              <span class="slider"></span>
            </div>
          </label>
        </div>
      </div>

      <!-- Accordion 3: Audio Controls -->
      <div class="accordion-item" id="acc-audio-controls">
        <div class="accordion-header" role="button" tabindex="0" aria-expanded="false">
          <div class="icon-box icon-magenta">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 10v4"/>
              <path d="M6 6v12"/>
              <path d="M10 3v18"/>
              <path d="M14 7v10"/>
              <path d="M18 5v14"/>
              <path d="M22 10v4"/>
            </svg>
          </div>
          <div class="feature-info">
            <div class="feature-title">Audio controls</div>
            <div class="feature-desc" id="acc-audio-desc">Booster on • Custom 10-Band EQ</div>
          </div>
          <svg class="chevron-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        <div class="accordion-body">
          <label class="sub-toggle-row" for="pop-audioEffects">
            <span class="sub-toggle-label">🔊 Web Audio Engine DSP</span>
            <div class="toggle-switch">
              <input type="checkbox" id="pop-audioEffects" role="switch" aria-checked="false" />
              <span class="slider"></span>
            </div>
          </label>

          <!-- Volume & Bass Cards -->
          <div class="audio-sliders-grid">
            <div class="slider-card">
              <div class="slider-card-head">
                <span>⚡ Volume Boost</span>
                <span id="pop-vol-value" class="slider-val-vol">100%</span>
              </div>
              <input type="range" id="pop-vol-slider" min="100" max="600" step="10" value="100" class="audio-range" aria-label="Volume Booster" />
            </div>

            <div class="slider-card">
              <div class="slider-card-head">
                <span>🔉 Bass Boost</span>
                <span id="pop-bass-value" class="slider-val-bass">0 dB</span>
              </div>
              <input type="range" id="pop-bass-slider" min="0" max="20" step="1" value="0" class="audio-range" aria-label="Bass Booster" />
            </div>
          </div>

          <!-- Preset Chips -->
          <div class="preset-label">EQ Presets</div>
          <div id="pop-eq-preset-chips" class="preset-chips-container" role="group" aria-label="Equalizer Presets">
            <button data-preset="Flat" class="preset-chip" type="button">Flat</button>
            <button data-preset="Bass Boost" class="preset-chip" type="button">Bass Boost</button>
            <button data-preset="Vocal Booster" class="preset-chip" type="button">Vocal</button>
            <button data-preset="Treble Boost" class="preset-chip" type="button">Treble</button>
            <button data-preset="Rock" class="preset-chip" type="button">Rock</button>
            <button data-preset="Pop" class="preset-chip" type="button">Pop</button>
            <button data-preset="Acoustic" class="preset-chip" type="button">Acoustic</button>
            <button data-preset="Electronic" class="preset-chip" type="button">Electronic</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Hidden compatibility elements for existing background listeners & tests -->
    <div style="display:none !important;" aria-hidden="true">
      <input type="checkbox" id="pop-audioEffects-header" checked />
      <input type="checkbox" id="pop-noise-remover-toggle" checked />
      <input type="checkbox" id="pop-eq-toggle" checked />
      <select id="pop-eq-preset"><option value="Flat">Flat</option></select>
      <button id="pop-eq-reset" type="button">Reset</button>
      <div id="pop-thermal-alert"></div>
      <canvas id="pop-spectrum-canvas" width="10" height="10"></canvas>
      <div id="pop-eq-rack"></div>
      <input type="text" id="pop-blocked-keywords" />
      <input type="text" id="pop-blocked-channels" />
      <div id="popup-rank-tier"></div>
      <div id="today-time"></div>
      <div id="learning-time"></div>
      <div id="focus-score"></div>
    </div>

    <!-- Footer Action -->
    <footer class="footer">
      <button id="open-dashboard-btn" class="open-dashboard-btn" type="button">
        <span>Open full dashboard</span>
        <span class="btn-arrow">↗</span>
      </button>
    </footer>
  </div>

  <script src="../utils/browser-detection.js"></script>
  <script src="../utils/design-tokens.js"></script>
  <script src="../utils/storage.js"></script>
  <script src="../utils/gamification-engine.js"></script>
  <script src="../utils/audio-engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
